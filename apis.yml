aid: peerstreet
name: PeerStreet
description: >-
  PeerStreet was a two-sided marketplace for real estate debt investing that connected
  individual and institutional investors with short-term, high-yield real estate loans
  originated by a nationwide network of private lenders. The platform let investors build
  diversified portfolios of loan positions, earn monthly interest, and access loan-level
  documentation and performance data, along with a "Pocket" cash account and self-directed
  IRA options for accredited investors. Operating as a licensed California finance lender
  (License 60DBO-45398) and backed by a16z, PeerStreet transacted more than $5B across 47
  states before filing for Chapter 11 bankruptcy in June 2023. The company is profiled in
  the API Evangelist network as an a16z portfolio company; no public developer program,
  API reference, or machine-readable API surface was found during enrichment.
